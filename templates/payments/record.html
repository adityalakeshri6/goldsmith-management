{% extends 'base.html' %}
{% block title %}Record Payment{% endblock %}
{% block content %}
<h2 class="mb-3">Record Payment — Order #{{ order.pk }}</h2>
<p>Remaining balance: <strong>₹{{ order.remaining_amount }}</strong></p>
<form method="post" class="card p-4" style="max-width:400px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-warning">Save Payment</button>
</form>
{% endblock %}
