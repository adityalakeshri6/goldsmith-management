{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-3">Create your account</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning w-100">Sign Up</button>
      </form>
      <p class="mt-3 mb-0">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
