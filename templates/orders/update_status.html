{% extends 'base.html' %}
{% block title %}Update Order Status{% endblock %}
{% block content %}
<h2 class="mb-3">Update Status — Order #{{ order.pk }}</h2>
<form method="post" class="card p-4" style="max-width:400px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-warning">Update</button>
</form>
{% endblock %}
